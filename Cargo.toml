[package]
name = "kmem-drain-rs"
version = "0.1.0"
edition = "2021"
authors = ["Patrick Isles <patrick.isles@pcc.edu>"]
description = "Linux Zombie Shared-Memory Reaper, Kernel Slab Bloat Forensic Scanner & Memory Stall Sentinel in pure Rust"
license = "MIT"

[dependencies]
libc = "0.2"
tiny_http = "0.12"
crossbeam-channel = "0.5"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
